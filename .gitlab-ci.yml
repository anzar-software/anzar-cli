variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  IMAGE_NAME: $DOCKER_HUB_USERNAME/anzar
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA 
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  # Enable Rust build caching
  CARGO_INCREMENTAL: 0

# Cache dependencies and build artifacts
# cache:
