cache:
  - key: cargo-registry-${CI_COMMIT_REF_SLUG}
    paths:
      - $CARGO_HOME/registry
  - key: cargo-tools-${CI_COMMIT_REF_SLUG}
    paths:
      - $CARGO_HOME/bin
  - key: rust-target-${CI_COMMIT_REF_SLUG}
    paths:
      - target/
    policy: pull

stages:
  - prepare
  - lint
  - test
  - deploy

# Prepare
#-------------------------

.prepare_base:
  image: rust:latest
  stage: prepare
  cache:
    - key: cargo-registry-${CI_COMMIT_REF_SLUG}
      paths:
        - $CARGO_HOME/registry
    - key: cargo-tools-${CI_COMMIT_REF_SLUG}
      paths:
        - $CARGO_HOME/bin
    - key: rust-target-${CI_COMMIT_REF_SLUG}
      paths:
        - target/
      policy: push
  rules:
    - if: $CI_COMMIT_TAG


prepare:api:
  extends: .prepare_base
  script:
    - cargo build -p api --release
    - strip target/release/api
  artifacts:
    paths:
      - target/release/api
    expire_in: 1 day

prepare:cli:
  extends: .prepare_base
  script:
    - cargo build -p cli --release
    - strip target/release/cli
  artifacts:
    paths:
      - target/release/cli
    expire_in: 1 day

# Lint
#-------------------------
lint:fmt:
  image: rust:latest
  stage: lint
  needs: []
  before_script:
    - rustup component add rustfmt 
  script:
    - cargo fmt --all -- --check
  rules:
    - if: $CI_COMMIT_TAG

lint:clippy:
  image: rust:latest
  stage: lint
  allow_failure: true
  needs: [prepare]
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy -- -D warnings
  rules:
    - if: $CI_COMMIT_TAG

# Test
#-------------------------
security-audit:
  image: rust:latest
  stage: test
  allow_failure: true
  script:
    - cargo audit --version || cargo install cargo-audit
    - cargo audit
  rules:
    - if: $CI_COMMIT_TAG

## =============================================================================
## Tests Service - MongoDB, PostgreSQL, Sqlite
## =============================================================================
.test_base:
  image: rust:latest
  stage: test
  needs: [prepare:api]

test:mongodb:
  extends: .test_base
  services:
    - name: mongo:8.0
      alias: db
      variables:
        MONGO_INITDB_ROOT_USERNAME: hakou
        MONGO_INITDB_ROOT_PASSWORD: password
        MONGO_INITDB_DATABASE: prod
    - name: memcached:latest
      alias: cache
  script:
    - DB=mongodb CACHE=memcached cargo test -p api --jobs $(nproc)
  rules:
    - if: $CI_COMMIT_TAG

test:postgres:
  extends: .test_base
  services:
    - name: postgres:16-alpine
      alias: db
      variables:
        POSTGRES_PASSWORD: password
        POSTGRES_USER: hakou
        POSTGRES_DB: prod
    - name: memcached:latest
      alias: cache
  script:
    - DB=postgres CACHE=memcached cargo test -p api --jobs $(nproc)
  rules:
    - if: $CI_COMMIT_TAG


## =============================================================================
## Deployment Service - Docker
## =============================================================================
build:api:
  image: docker:latest
  stage: deploy
  needs: [prepare, test:mongodb, test:postgres]
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  rules:
    - if: $CI_COMMIT_TAG



build:cli:
  stage: deploy
  image: rust:latest
  variables:
    GIT_DEPTH: 0
    # GITLAB_TOKEN: $CI_JOB_TOKEN  # ← add this
    GITLAB_TOKEN: $RELEASE_TOKEN  # ← add this

  before_script:
    - wget -P /tmp https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
    - tar -xf /tmp/zig-linux-x86_64-0.13.0.tar.xz -C /tmp
    - export PATH=/tmp/zig-linux-x86_64-0.13.0:$PATH
    - zig version  # verify

    - curl -sfL https://goreleaser.com/static/run -o /usr/local/bin/goreleaser
    - chmod +x /usr/local/bin/goreleaser
    - export PATH=$PATH:/usr/local/bin
  script:
    - export GITLAB_TOKEN=$RELEASE_TOKEN
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG

