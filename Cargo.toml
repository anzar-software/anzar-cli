[package]
edition = "2024"
rust-version = "1.85"

name = "anzar"
description = "Anzar is a lightweight authentication and authorization framework that runs as a separate microservice"
readme = "README.md"
license = "GPL-3.0"
version = "0.8.4"
authors = ["Hakou Guelfen <hakoudev@gmail.com>"]
homepage = "https://anzar_software.gitlab.io/docs"
repository = "https://gitlab.com/anzar_software/api"
categories = ["authentication", "web-programming", "network-programming"]
keywords = [
  "Software Development",
  "Authentication",
  "Authorization",
  "MicroService"
]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "anzar"

[profile.release]
opt-level = 'z'          # Optimize for size
lto = true               # Link-time optimization
codegen-units = 1        # Better optimization, slower compile
panic = 'abort'          # Remove panic unwinding
strip = true             # Strip symbols in cargo

# Optional: Further size reduction
[profile.release.package."*"]
opt-level = 'z'
strip = true

[dependencies]
actix-cors = "0.7.0"
# NOTE maybe use secure_coockie from actiw-web
actix-web = { version = "4.11.0", features = ["rustls-0_23"] } 
actix-session = { version = "0.11.0", features = ["cookie-session", "redis-session"] }

tokio = "1.48.0"

chrono = { version = "0.4.37", features = ["serde"] }

# Json
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
serde = "1.0.197"
serde_json = "1.0.115"
serde_yaml = "0.9.34"

# Database
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid", "chrono", "json"] }
mongodb = { version = "3.4.1", features = ["rustls-tls"] }
memcache = { version = "0.19", default-features = false }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# Tests
async-trait = "0.1.82"

# Cryptography
sha2 = "0.10.9"
argon2 = "0.5.3"
base64 = "0.22.1"
hmac = "0.12.1"
rustls = { version = "0.23.32", features = ["ring"] }
rustls-pemfile = "2.2.0"

# Tracing
tracing = { version = "0.1.40", features = ["log"] }
tracing-bunyan-formatter = "0.3.9"
tracing-subscriber = { version = "0.3.18", features = ["registry", "env-filter"] }
tracing-actix-web = "0.7.14"
thiserror = "2.0.18"

tracing-opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.31", features = ["tonic"] }
opentelemetry_sdk = "0.31"


rand = "0.9.1"
validator = { version = "0.20.0", features = ["derive"] }
dashmap = "6.1.0"
uuid = "1.18.1"
config = "0.15.19"
secrecy = { version = "0.10.3", features = ["serde"] }

utoipa = { version = "5.4.0", features = ["chrono", "actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "vendored"] }
opentelemetry = "0.31.0"


[dev-dependencies]
reqwest = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls"] }
